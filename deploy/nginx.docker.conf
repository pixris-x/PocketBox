# ============================================================
# 口袋工具箱 PocketBox — docker-compose 内的 nginx 统一入口
#
# 用途：本机跑一套「最接近生产」的完整链路（nginx + 前端 + API），
#       不需要在宿主机装/配 nginx。
#
# ⚠ 与 deploy/nginx.conf 的区别（两者不能混用）：
#   - 本文件给「compose 网络内的 nginx 容器」用 → upstream 写 **服务名**（web / api）
#   - deploy/nginx.conf 给「宿主机 nginx」用     → upstream 写 **127.0.0.1:映射端口**
#
# 挂载方式见 docker-compose.yml：
#   ./deploy/nginx.docker.conf → /etc/nginx/conf.d/default.conf
# ============================================================

server {
    listen 80;
    # compose 内只有一个站点，用 _ 承接任意 Host
    server_name _;

    server_tokens off;

    # 反代响应同样走 gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端 API（.NET）：整段 /api/ 转给 api 服务。
    # nginx 前缀匹配取最长者，所以 /api/xxx 会命中这里而不是下面的 /。
    location /api/ {
        # ⚠ 末尾不要加斜杠：加了会把 /api 前缀吃掉，请求变成 /ip 而 404
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # API 靠这两个头识别访客来源；缺失会退化成容器网关地址
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源（Node 静态服务器，含 SPA fallback）
    location / {
        proxy_pass http://web:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
