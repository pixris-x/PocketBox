# ============================================================
# 口袋工具箱 PocketBox — 宿主机 nginx 反向代理配置
# 容器内只跑零依赖 Node 静态服务器（deploy/server.js），
# 由本配置对外提供 gzip / 安全头 / 缓存。
# 用法：放入 /etc/nginx/conf.d/ 或 sites-enabled/ 后 reload
# ============================================================

server {
    listen 80;
    server_name your.domain.com;   # 换成你的域名或 _ 

    # 隐藏版本号
    server_tokens off;

    # 反代响应也走 gzip（对 proxied response 同样生效）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端 API（.NET）：整段 /api/ 转给 API 容器。
    # nginx 前缀匹配取最长者，所以 /api/xxx 会命中这里而不是下面的 /。
    location /api/ {
        # 指向 docker-compose.yml 里 "8702:8080" 的左侧
        proxy_pass http://127.0.0.1:8702;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # API 侧靠这两个头识别访客来源，缺了会退化成容器网关地址
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 指向容器映射到宿主机的端口（docker-compose.yml 里 "8701:3000" 的左侧）
        proxy_pass http://127.0.0.1:8701;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS 建议用 certbot 一键生成：
#   sudo certbot --nginx -d your.domain.com
# 它会自动在上方 server 块基础上补 443 配置和 80 跳转。
