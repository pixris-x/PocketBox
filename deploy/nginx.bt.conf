# ============================================================
# 口袋工具箱 PocketBox — 线上实际生效的宿主机 nginx 配置（宝塔面板托管）
#
# 域名：pocketbox.pixris.online
# 链路：宿主机 nginx → 127.0.0.1:8701（web 容器）/ 127.0.0.1:8702（api 容器）
#
# 本文件是「线上配置的版本管理副本」，不由 Docker / compose 挂载，改了不会影响容器。
# 它存在的意义：防止「仓库里写了防护但线上没生效」——线上跑的是宝塔生成的配置，
# 仓库另外两份（nginx.conf / nginx.docker.conf）都不是生产实配，职责划分见 AGENTS.md §7。
#
# 段落归属（决定改动能不能活过面板重写）：
#   [面板维护]  SSL-START / REDIRECT / PROXY-CONF / LOG / 敏感文件拦截等段，
#              面板改证书、改反代目标时会整体重写，手改可能被覆盖；
#              优先用面板 UI 改，改完把结果回填本副本。
#   [面板锚点]  PHP-INFO / REWRITE / IP-RESTRICT / BASICAUTH / SUB_FILTER /
#              GZIP / GLOBAL-CACHE 这 7 组线上是空的，但锚点必须留着 —— 面板靠
#              START/END 把功能内容写进这些槽位，删了功能就静默失效。见下方原位。
#   [仓库维护]  #SERVER-BLOCK START/END 之间的内容面板不会覆盖，自定义一律写这里。
#              宝塔另有第二个安全落点：面板「自定义配置文件」会写到
#              /www/server/panel/vhost/nginx/extension/<域名>/*.conf，由顶部 include 引入。
#              本站线上没用它；一旦往那里挪东西，本副本就看不到了 —— 必须同步回填。
#
# ⚠ 副本与线上不一致时，一律以线上为准并立即回填本文件。
#
# ⚠⚠ 本文件**不可整份覆盖到线上**。它带有 60 行说明注释和一个「← 」改动标记体系，
#     且第 1、2 项改动落在面板会重写的段落里，粘过去会被打回原形。
#     正确用法：照下面的「← 」清单逐条在面板（优先）或 #SERVER-BLOCK 段内手工落地，
#     落地后再把线上真实生效的版本覆盖回本文件。
#
# 本副本相对宝塔默认生成值主动做了 4 处收紧，每处都用「← 」标出：
#   1. 补 80 → 443 强制跳转。此前站点可被明文 HTTP 完整访问，而 HSTS 头在
#      http 响应上浏览器必须忽略，等于没生效；对主打「密钥不出浏览器」的站点，
#      明文信道可被中间方改写 JS。**用面板「强制HTTPS」开关实现，别粘这段 if。**
#   2. 去掉 TLSv1.1 与 3DES 套件（RFC 8996 废弃 TLS 1.1；3DES 有 SWEET32）。
#      **优先在面板 SSL 设置里改 TLS 版本**；面板不提供套件输入框时再改 ssl_ciphers 行。
#   3. 补齐仓库 nginx.conf 里有、线上却缺失的 3 个安全响应头（加在 #SERVER-BLOCK 段内）。
#   4. 站点级 gzip。**加之前先 `nginx -T | grep -n gzip` 确认全局没开**，
#      宝塔通常已在全局 nginx.conf 里配好，重复加无害但多余；
#      若要按面板方式管理，应走「#GZIP START/END」锚点段而不是写进 SERVER-BLOCK。
#
# 未纳入本副本改动、需要你在面板侧确认的事项：
#   - server_tokens off：通常在宝塔全局 nginx.conf 里，本站未单独设置。
#   - proxy_cache_path 已在下方声明但目前没有任何 location 引用它 —— 缓存未生效。
#     若日后启用，务必不要加 `proxy_ignore_headers Cache-Control`：
#     deploy/server.js 对 /assets/ 发 immutable 一年、对 sw.js 与 index.html 发 no-cache，
#     nginx 默认尊重上游 no-cache 才不缓存；一旦忽略，Web 版 SW 更新通道会把用户钉在旧版本。
#   - 下面两段 include 的内容不在本仓库可见范围，排查问题时记得一并检查：
#       /www/server/panel/vhost/nginx/extension/pocketbox.pixris.online/*.conf
#       /www/server/panel/vhost/nginx/well-known/pocketbox.pixris.online.conf
# ============================================================

# [面板维护] keys_zone 已声明但无人引用，见上方说明
proxy_cache_path /www/dk_project/sites/pocketbox.pixris.online/proxy_cache_dir levels=1:2 keys_zone=pocketbox_pixris_online_cache:20m inactive=1d max_size=5g;

server {
    listen 80;

    listen 443 ssl;
    http2 on;

    server_name pocketbox.pixris.online;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/dk_project/wwwroot/pocketbox.pixris.online;
    include /www/server/panel/vhost/nginx/extension/pocketbox.pixris.online/*.conf;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/pocketbox.pixris.online.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/pocketbox.pixris.online/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/pocketbox.pixris.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;  # ← 2 原值含 TLSv1.1
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!MD5;  # ← 2 原值含 EECDH+3DES:RSA+3DES
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;  # ← 3 补 always，使其在 4xx/5xx 上一并下发
    error_page 497  https://$host$request_uri;
    #SSL-END
    #REDIRECT START
    # ← 1 强制 HTTPS。本段只是记录面板「强制HTTPS」开关会生成什么，
    #   实际请在面板里开这个开关 —— 手写在这里，面板下次重写 REDIRECT 段会冲掉。
    if ($scheme != https) {
        return 301 https://$host$request_uri;
    }
    #REDIRECT END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    # ------------------------------------------------------------------
    # 下面 7 组标记块线上都是空的，但**必须保留**：宝塔按 START/END 锚点
    # 把对应功能的内容 splice 进来，锚点没了功能就静默失效、且很难排查。
    # 整理本文件时不要「顺手删掉空注释块」——副本已经犯过一次这个错。
    # 保留后本文件与线上可逐段 diff，只会出现真实差异而不是排版差异。
    # ------------------------------------------------------------------

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    #REWRITE-END

    #IP-RESTRICT-START 限制访问ip的配置，IP黑白名单
    #IP-RESTRICT-END

    #BASICAUTH START
    #BASICAUTH END

    #SUB_FILTER START
    #SUB_FILTER END

    #GZIP START
    #GZIP END

    #GLOBAL-CACHE START
    #GLOBAL-CACHE END

    #WEBSOCKET-SUPPORT START
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    #WEBSOCKET-SUPPORT END
    # ↑ $connection_upgrade 由宝塔在全局 nginx.conf 的 http 段 map 出来，勿在本站重复定义

    #PROXY-CONF-START
    location ^~ / {
        # [面板维护] 反代目标 = docker-compose.yml 里 "'127.0.0.1:8701:3000'" 的中间一段
        proxy_pass http://127.0.0.1:8701;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    #PROXY-CONF-END

    #SERVER-BLOCK START
    # ↓↓↓ [仓库维护] 面板不会重写本段，自定义 server / location 一律加在这里 ↓↓↓

    # 后端 API（.NET）：整段 /api/ 转给 API 容器
    #
    # 为什么放在 PROXY-CONF 之后仍然生效：nginx 前缀 location 按「最长匹配」取胜，
    # 与书写顺序无关，/api/ 比 / 长，所以 /api/ip/region 命中本块。
    # 两块都带 ^~，命中后不再检查正则 location —— 这正是下方敏感文件拦截规则
    # 全部失效的原因（见文件末尾说明）。
    location ^~ /api/ {
        # 指向 docker-compose.yml 里 "'127.0.0.1:8702:8080'" 的中间一段。
        # ⚠ 末尾不要加斜杠：加了会吃掉 /api 前缀，请求变成 /ip 而 404。
        proxy_pass http://127.0.0.1:8702;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # ⚠ 这三行是后端防伪造的前提，删掉任何一行 /api/ip 都会拿到错误的来源地址。
        # $remote_addr 是 TCP 真实对端（即 nginx 自己），客户端自报的头到这里已被覆盖。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端只做只读 JSON，不需要 600s 超时；容器健康检查也走 /api/ip
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 安全响应头（对齐仓库 deploy/nginx.conf）
    #
    # ⚠ nginx 的 add_header 是「同层累加、跨层不继承」：一旦某个 location 内部写了
    #   自己的 add_header（例如面板日后给反代加缓存头），上面和下面这些 server 层的头
    #   在该 location 会全部消失。改完用 curl -I 验证三个头都还在。
    add_header X-Content-Type-Options nosniff always;  # ← 3
    add_header X-Frame-Options SAMEORIGIN always;      # ← 3
    add_header Referrer-Policy strict-origin-when-cross-origin always;  # ← 3

    # 压缩（对反代响应同样生效）
    # ⚠ 加之前先 `nginx -T | grep -n gzip`：宝塔通常已在全局 nginx.conf 配好，
    #   全局已开就别在这里重复加；要按面板方式管理请改用文件上方的 #GZIP 锚点段。
    gzip on;                  # ← 4
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # ↑↑↑ [仓库维护] 自定义内容到此为止 ↑↑↑
    #SERVER-BLOCK END

    # 以下两段 [面板维护] 由宝塔生成 ——
    # ⚠ 实际处于失效状态：上面 location ^~ / 能匹配所有 URI，而 ^~ 的语义是
    #   「前缀命中后不再检查正则 location」，所以这些 ~* 正则永远不会被求值。
    #   今天无害（一切请求都走反代，root 指向的目录里本来就没东西），
    #   但如果哪天改成从磁盘直接托管 dist/，这两段保护将形同虚设，届时必须
    #   把 ^~ 换成普通前缀匹配、或改用 map 在 location 外部做拦截。
    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location /.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    #LOG START
    access_log  /www/wwwlogs/pocketbox.pixris.online.log;
    error_log  /www/wwwlogs/pocketbox.pixris.online.error.log;
    #LOG END
}
