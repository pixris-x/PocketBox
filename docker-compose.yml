services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pocketbox:latest
    container_name: pocketbox
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口 —— 宿主机 nginx 反代指向这个端口
      - '8701:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      # 上下文用 backend/：csproj 通过 ..\data\ 引用离线 IP 库，该目录在上下文内
      context: ./backend
      dockerfile: Dockerfile
    image: pocketbox-api:latest
    container_name: pocketbox-api
    restart: unless-stopped
    ports:
      # 同样只映射到宿主机回环给 nginx 反代用，不要直接暴露到公网：
      # /api/ip 依赖 X-Real-IP / X-Forwarded-For，直接暴露会让人随意伪造来源地址
      - '8702:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/api/ip']
      interval: 30s
      timeout: 5s
      retries: 3

  # 统一入口：在本机复刻生产链路（nginx → 静态前端 / .NET API），宿主机无需装 nginx。
  # ⚠ 这里挂载的是 deploy/nginx.docker.conf —— 它的 upstream 写的是 compose 服务名
  #   （web / api）。给宿主机 nginx 用的 deploy/nginx.conf 写的是 127.0.0.1:映射端口，两者不能混用。
  # ★ profiles: local —— 默认的 `docker compose up -d` 不会启动它。
  #   本机：docker compose --profile local up -d
  #   线上：直接 docker compose up -d 即可（线上已有宿主机 nginx 负责 TLS 与 /api 分流，
  #         再起一个容器版只会白拉镜像、白占 8080）
  nginx:
    profiles: ['local']
    image: nginx:alpine
    container_name: pocketbox-nginx
    restart: unless-stopped
    ports:
      # 本机入口：http://localhost:8080/
      # 不用 80 是因为宿主机 80 已被占用（Windows HTTP.sys 常驻）
      - '8080:80'
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
