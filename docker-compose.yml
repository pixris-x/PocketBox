services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: pocketbox:latest
    container_name: pocketbox
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3111

    expose:
      - '3111'

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3111/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      web:
        aliases:
          - pocketbox.web.pixris.com

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: pocketbox-api:latest
    container_name: pocketbox-api
    restart: unless-stopped

    environment:
      ASPNETCORE_URLS: http://+:4111
      ASPNETCORE_ENVIRONMENT: Production

    expose:
      - '4111'

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:4111/api/ip
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      web:
        aliases:
          - pocketbox-api.web.pixris.com

networks:
  web:
    external: true
    name: web
